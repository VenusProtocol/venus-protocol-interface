name: Release

# One workflow for main pushes (and manual runs).
#   - pending changesets   -> prepare chore/version-packages (never pushes to main, never opens a PR)
#   - no pending changesets and version not on npm -> build, then publish
# Both paths are decided by one check job, so one merge produces one run.
# Publishing only ever happens for refs/heads/main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max_old_space_size=4096"
  VITE_ENV: "ci"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      has_changesets: ${{ steps.check.outputs.has_changesets }}
      version: ${{ steps.check.outputs.version }}
      published: ${{ steps.check.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - id: check
        run: |
          if ls .changeset/*.md >/dev/null 2>&1; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi
          VERSION=$(node -p 'require("./packages/chains/package.json").version')
          NAME=$(node -p 'require("./packages/chains/package.json").name')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    needs: check
    if: needs.check.outputs.has_changesets == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Version and push branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          BRANCH="chore/version-packages"
          # Do not rewrite the branch while its version PR is open: pushes made by
          # GITHUB_TOKEN do not start CI, so the PR would be left without checks.
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            MSG="Version PR #$PR is open, so $BRANCH was not updated. Close it, then re-run prepare to include new changesets."
            echo "::error::$MSG"
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
            gh pr comment "$PR" --body "$MSG"
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -B "$BRANCH" "$GITHUB_SHA"
          npx --yes @changesets/cli@2.31.1 version
          if git diff --quiet; then
            echo "No version change."
            exit 0
          fi
          git add -A
          git commit -m "chore: bump package versions"
          git push --force-with-lease origin "$BRANCH"
          echo "Branch $BRANCH is ready. Open a PR to main by hand."

  # Installs dependencies, runs tests and builds the package.
  # Has no id-token and no publish rights; it only uploads the files to publish.
  build:
    needs: check
    if: needs.check.outputs.has_changesets == 'false' && needs.check.outputs.published == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      CLI_NODE_REAL_API_KEY: ${{ secrets.CLI_NODE_REAL_API_KEY }}
      CLI_ALCHEMY_API_KEY: ${{ secrets.CLI_ALCHEMY_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test --coverage

      - name: Build chains package
        run: yarn workspace @venusprotocol/chains build

      - name: Upload package files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chains-package
          retention-days: 1
          if-no-files-found: error
          path: |
            packages/chains/package.json
            packages/chains/README.md
            packages/chains/CHANGELOG.md
            packages/chains/build/

  # Publishes the files produced by the build job.
  # No dependency install and no repository scripts run here; only the
  # id-token is available in this job.
  publish:
    needs: [check, build]
    if: needs.check.outputs.has_changesets == 'false' && needs.check.outputs.published == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Download package files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chains-package
          path: packages/chains

      - name: Install npm with trusted publishing support
        run: npm install -g npm@11.5.1 # https://docs.npmjs.com/trusted-publishers

      - name: Publish
        working-directory: packages/chains
        run: npm publish
